<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>avocado&amp;brownies — Baked with love, craved forever</title>
    <meta name="description" content="avocado&brownies. The Magnum Cake, fudge brownies and an all-day café menu, baked with love and craved forever." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/img/plates/magnum.webp" />
    <link rel="preload" href="/fonts/JustAnotherHand.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* loader styles live here so the first frame is already right */
      @font-face { font-family: 'Just Another Hand'; src: url('/fonts/JustAnotherHand.woff2') format('woff2'); font-display: block; }
      html, body { background: #000; margin: 0; }
      .loader { position: fixed; inset: 0; z-index: 100; }
      .loader[hidden] { display: none; }
      .loader__sheet { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(55% 45% at 50% 50%, rgba(255, 109, 37, var(--glow, 0)), rgba(255, 109, 37, 0) 70%), #050404; will-change: transform; }
      .loader__word { position: relative; width: min(88vw, 1100px); height: auto; overflow: visible; opacity: 0; transition: opacity 0.6s; }
      .loader.ready .loader__word { opacity: 1; }
      .ld-t { font-family: 'Just Another Hand', cursive; font-size: 176px; }
      .ld-outline { fill: none; stroke: rgba(255, 246, 234, 0.2); stroke-width: 1.3; }
      .loader__stream { position: absolute; top: 0; left: 50%; width: 5px; height: 0; margin-left: -2.5px; border-radius: 0 0 4px 4px; background: linear-gradient(90deg, #b8400a, #ffb07a 45%, #ff6d25); box-shadow: 0 0 14px rgba(255, 109, 37, 0.55); transform-origin: 50% 100%; }
      .loader__meta { position: absolute; left: 0; right: 0; bottom: max(28px, 6vh); display: flex; justify-content: center; gap: 14px; font: 400 12px/1 system-ui, sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255, 246, 234, 0.55); }
      .loader__meta b { color: #ff6d25; font-weight: 400; min-width: 3ch; text-align: left; font-variant-numeric: tabular-nums; }
      .loader__meta b::after { content: '%'; }
    </style>
  </head>
  <body>
    <div class="loader" id="loader" aria-hidden="true">
      <div class="loader__sheet" id="loaderSheet">
        <div class="loader__stream" id="loaderStream"></div>
        <svg class="loader__word" id="loaderWord" viewBox="0 0 1000 240" overflow="visible">
          <defs>
            <clipPath id="ldClip"><text x="500" y="178" text-anchor="middle" textLength="930" lengthAdjust="spacingAndGlyphs" class="ld-t">avocado&amp;brownies</text></clipPath>
            <linearGradient id="ldLiq" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffb07a" />
              <stop offset="0.12" stop-color="#ff7a35" />
              <stop offset="0.55" stop-color="#ff6d25" />
              <stop offset="1" stop-color="#c2440c" />
            </linearGradient>
            <linearGradient id="ldShine" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.5" stop-color="#fff" stop-opacity="0.6" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <text x="500" y="178" text-anchor="middle" textLength="930" lengthAdjust="spacingAndGlyphs" class="ld-t ld-outline">avocado&amp;brownies</text>
          <g clip-path="url(#ldClip)">
            <path id="ldLiquid" fill="url(#ldLiq)" d="M0 260 L1000 260 Z" />
            <rect id="ldShine" x="-260" y="-20" width="160" height="300" fill="url(#ldShine)" transform="skewX(-18)" />
          </g>
        </svg>
        <div class="loader__meta"><span id="loaderMsg">Melting the chocolate</span><b id="loaderNum">0</b></div>
      </div>
    </div>

    <header class="nav" id="nav">
      <a class="nav__logo" href="#/" aria-label="avocado&brownies home">avocado&amp;brownies</a>
      <nav class="nav__links" aria-label="Primary">
        <a href="#/shop">Shop</a>
        <a href="#/" data-scroll="signatures">Signatures</a>
        <a href="#/" data-scroll="film">Film</a>
        <a href="#/" data-scroll="cafe">The café</a>
      </nav>
      <div class="nav__right">
        <button class="nav__bag" id="bagBtn" aria-label="Open bag">Bag <b id="bagCount">0</b></button>
        <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i></button>
      </div>
    </header>

    <div class="menu" id="menu" aria-hidden="true">
      <nav class="menu__nav" aria-label="Menu">
        <a href="#/" style="--i:0"><span class="menu__n">01</span><span class="menu__line"><span>Home</span></span></a>
        <a href="#/shop" style="--i:1"><span class="menu__n">02</span><span class="menu__line"><span>Shop</span></span></a>
        <a href="#/" data-scroll="signatures" style="--i:2"><span class="menu__n">03</span><span class="menu__line"><span>Signatures</span></span></a>
        <a href="#/" data-scroll="film" style="--i:3"><span class="menu__n">04</span><span class="menu__line"><span>Film</span></span></a>
        <a href="#/" data-scroll="cafe" style="--i:4"><span class="menu__n">05</span><span class="menu__line"><span>The café</span></span></a>
      </nav>
      <div class="menu__foot">
        <p class="menu__tag">Baked with love, craved forever!</p>
        <div class="menu__btns">
          <a class="menu__btn" href="#/shop">Shop the bakes</a>
          <button class="menu__btn menu__btn--line" type="button" data-open-bag>Your bag</button>
        </div>
      </div>
      <div class="menu__plate" aria-hidden="true"><img src="/img/plates/milkcake.webp" alt="" width="520" height="520"></div>
    </div>

    <main id="app"></main>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Your bag" aria-hidden="true">
      <div class="drawer__head">
        <h2>Your bag</h2>
        <button id="drawerClose" aria-label="Close bag">Close</button>
      </div>
      <div class="drawer__body" id="drawerBody"></div>
      <div class="drawer__foot" id="drawerFoot"></div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
